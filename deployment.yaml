apiVersion: apps/v1
kind: Deployment
metadata:
  name: currency-service
  namespace: default
  labels:
    app: currency-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: currency-service
  template:
    metadata:
      labels:
        app: currency-service
    spec:
      containers:
        - name: currency-service
          image: currency-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: USE_EXTERNAL_API
              value: "false"
            # Uncomment and use a Secret when integrating a real API key:
            # - name: EXCHANGE_API_KEY
            #   valueFrom:
            #     secretKeyRef:
            #       name: exchange-api-secret
            #       key: api-key
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
